      <div class="hof-tadel-acrostic-container3">
        <style>
          @media (prefers-reduced-motion: reduce) {
          .hof-tadel-acrostic-item {
            transition: none;
          }
          .hof-tadel-acrostic-item:hover {
            transform: none;
          }
          }
        </style>
      </div>
    </div>
    <div class="hof-tadel-acrostic-container4">
      <div class="hof-tadel-acrostic-container5">
        <script defer data-name="hof-tadel-acrostic-anim">
          document.addEventListener('DOMContentLoaded', function() {
            (function(){
              const acrosticItems = document.querySelectorAll(".hof-tadel-acrostic-item")

              const observerOptions = {
                threshold: 0.2,
                rootMargin: "0px",
              }

              const acrosticObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry, index) => {
                  if (entry.isIntersecting) {
                    setTimeout(() => {
                      entry.target.style.opacity = "1"
                      entry.target.style.transform = "translateY(0)"
                    }, index * 100)
                    acrosticObserver.unobserve(entry.target)
                  }
                })
              }, observerOptions)

              acrosticItems.forEach((item) => {
                item.style.opacity = "0"
                item.style.transform = "translateY(30px)"
                item.style.transition = "opacity 0.6s ease-out, transform 0.6s ease-out"
                acrosticObserver.observe(item)
              })
            })()
          });
        </script>
      </div>
    </div>
  </div>
</div>
